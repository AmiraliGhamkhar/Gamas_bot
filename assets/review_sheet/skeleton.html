<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE_TAG}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#17302b;--mut:#587069;--line:#d6e1db;
--pri:#1c7a5a;--pri-s:#e1f3ea;--sec:#6a4bb5;--sec-s:#ece7f8;--carb:#b86e08;--carb-s:#fcefd6;
--rx:#c0393a;--rx-s:#fbe4e3;--blu:#2a6aa8;--blu-s:#e1edf8;--tl:#12808a;--tl-s:#dcf2f3;--pk:#ad3b77;--pk-s:#f8e3ee;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d1513;--card:#15201e;--ink:#e4eeea;--mut:#9bb2ab;--line:#2a3b37;
--pri:#4cc79c;--pri-s:#13312a;--sec:#ab97ee;--sec-s:#251f3e;--carb:#f0b04d;--carb-s:#38290f;
--rx:#f28685;--rx-s:#3b1e1e;--blu:#7fb6ea;--blu-s:#13283b;--tl:#5fd0d9;--tl-s:#0f2f39;--pk:#e883b8;--pk-s:#3a1a2b}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/2 Vazirmatn,Vazir,Tahoma,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:800px;margin:auto;padding:0 16px}
e{direction:ltr;unicode-bidi:isolate;display:inline-block;font-style:normal;font-size:.93em}
b{font-weight:800}
#pbw{position:fixed;top:0;left:0;right:0;height:4px;z-index:9;background:transparent}
#pb{height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--sec),var(--carb))}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(155deg,#0e3b31 0%,#1b2f5b 58%,#43307d 100%);padding:calc(env(safe-area-inset-top,0px) + 34px) 0 30px}
.hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.13}
.hero .wrap{position:relative}
.hero h1{margin:0 0 4px;font-size:clamp(28px,8vw,44px);font-weight:800;line-height:1.5}
.hero p{margin:0;color:#d3e4de;font-size:15px}
.clock{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.clock b{font-size:54px;line-height:1;font-weight:800}
.clock span{font-size:16px;color:#d3e4de}
.tbar{display:flex;gap:3px;height:34px;margin:6px 0 14px}
.tbar a{display:grid;place-items:center;border-radius:7px;color:#fff;font-size:12px;font-weight:800;text-decoration:none;background:var(--c);min-width:0}
.tbar a.ok,.chip.ok{outline:2px solid #fff}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-size:13px;line-height:1.6}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip b{margin-inline-start:auto;color:#ffd98e}
.sticky{position:sticky;top:0;z-index:8;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.sticky .wrap{display:flex;justify-content:space-between;padding-top:6px;padding-bottom:6px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
/* sections */
.sec{--c:var(--pri);--cs:var(--pri-s)}
.sh{display:flex;gap:12px;align-items:center;background:var(--cs);border-radius:18px;padding:12px 16px;margin:38px 0 12px;scroll-margin-top:46px}
.sh .ic{font-size:30px;line-height:1}
.sh h2{margin:0;font-size:20px;line-height:1.6;color:var(--c);font-weight:800}
.sh small{color:var(--mut);font-size:13px}
.sh a{margin-inline-start:auto;color:var(--mut);text-decoration:none;font-size:13px}
p{margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:12px 0}
.card h3{margin:0 0 2px;font-size:16.5px;color:var(--c);font-weight:800}
.key,.trap,.tip{border-radius:12px;padding:9px 14px;margin:12px 0;border-inline-start:5px solid;font-size:15.5px;line-height:1.95}
.key{background:var(--carb-s);border-color:var(--carb)}
.trap{background:var(--rx-s);border-color:var(--rx)}
.tip{background:var(--blu-s);border-color:var(--blu)}
.key>b:first-child,.trap>b:first-child,.tip>b:first-child{display:block;font-size:14px}
.key>b:first-child{color:var(--carb)}.trap>b:first-child{color:var(--rx)}.tip>b:first-child{color:var(--blu)}
ul{margin:6px 0;padding-inline-start:22px}li{margin:3px 0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.85;min-width:480px}
th{background:var(--cs);color:var(--c);text-align:start;padding:8px 12px;font-weight:800;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--cs)}
td:first-child{font-weight:600}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:12px 0}
.g2 .card{margin:0}
.pill{display:inline-block;padding:0 10px;border-radius:99px;background:var(--cs);color:var(--c);font-size:13px;font-weight:600;margin:2px 0}
.done{display:block;width:100%;margin:16px 0 0;padding:10px;border:2px dashed var(--c);border-radius:14px;background:transparent;color:var(--c);font:600 14.5px Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.sec.ok .done{background:var(--c);color:var(--bg);border-style:solid}
/* flow */
.zone{border-radius:18px;padding:12px;margin:12px 0}
.zone>h3{margin:0 0 8px;font-size:15px;font-weight:800}
.z1{background:var(--pri-s);color:var(--pri)}.z2{background:var(--sec-s);color:var(--sec)}
.nd{background:var(--card);color:var(--ink);border:1.5px solid currentColor;border-radius:12px;padding:6px 12px;text-align:center;font-size:14.5px;line-height:1.8}
.z1 .nd{border-color:var(--pri)}.z2 .nd{border-color:var(--sec)}
.ar{text-align:center;color:var(--mut);font-size:13px;line-height:1.5;padding:3px 0}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gray{border:2px dashed var(--mut);border-radius:14px;padding:6px 12px;text-align:center;color:var(--mut);font-size:13.5px;margin:8px 0}
/* spectrum */
.spec{display:flex;border-radius:14px;overflow:hidden;margin:12px 0;color:#fff;font-size:13.5px;line-height:1.7;text-align:center}
.spec div{padding:10px 8px}
.spec .a{flex:3;background:var(--pri)}.spec .m{flex:2.2;background:repeating-linear-gradient(135deg,#7d8a86 0 8px,#6b7773 8px 16px)}.spec .b{flex:3;background:var(--sec)}
/* monomers */
.mono{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.mono .card{margin:0;text-align:center}
.mono .em{font-size:28px;line-height:1.3}
.chain{direction:ltr;letter-spacing:-1px;font-size:20px;color:var(--c);line-height:1.2;margin:4px 0}
/* ladder */
.lad{margin:12px 0}
.lad div{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14.5px}
.lad span{height:30px;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
/* swatches */
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-inline-end:6px;border:1px solid rgba(0,0,0,.25)}
.arrow{color:var(--c);font-weight:800}
.fig{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0;color:var(--c);text-align:center;font-size:13.5px}
.fig svg{width:min(100%,300px);height:auto}
.eq{direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--cs);color:var(--c);border-radius:8px;padding:0 8px;font-size:13px;font-weight:600;margin:2px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:2px 14px}
summary{cursor:pointer;padding:8px 0;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"＋";color:var(--c);margin-inline-end:8px;font-weight:800}
details[open] summary:before{content:"－"}
details p{margin:2px 0 10px;color:var(--mut)}
footer{margin:36px 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.sticky,#pbw,.done{display:none}.hero{background:#1b2f5b}}
</style>
</head>
<body>
<div id="pbw"><div id="pb"></div></div>

<header class="hero">
<svg aria-hidden="true" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width="2"><polygon points="60,40 90,22 120,40 120,76 90,94 60,76"/><polygon points="120,76 150,58 180,76 180,112 150,130 120,112"/><polygon points="300,150 335,130 370,150 370,190 335,210 300,190"/><polygon points="250,200 280,183 310,200 310,236 280,254 250,236"/><circle cx="335" cy="130" r="5"/><circle cx="90" cy="94" r="5"/></g></svg>
<div class="wrap">
<p>{{KICKER}}</p>
<h1>{{H1}}</h1>
<div class="clock"><b>{{MINUTES_FA}}</b><span>دقیقه مطالعه، از اول تا آخر جلسه</span></div>
<div class="tbar" id="tbar"></div>
<div class="legend" id="legend"></div>
</div>
</header>
<div class="sticky"><div class="wrap"><span>مرورشده: <b id="cnt"></b></span><span>روی نوار رنگی یا هر بخش بزنید تا بپرد</span></div></div>

<main class="wrap">

{{SECTIONS}}

</main>
<footer class="wrap">{{FOOTER}}</footer>

<script>
(function(){
var S=[].slice.call(document.querySelectorAll('.sec')),tb=document.getElementById('tbar'),lg=document.getElementById('legend'),fa=function(n){return n.toLocaleString('fa-IR')};
document.body.id='top';
S.forEach(function(s){
var c=s.style.getPropertyValue('--c'),t=s.dataset.t;
if(s.classList.contains('quiz'))c='#3a4a46';
var a=document.createElement('a');a.href='#'+s.id;a.style.cssText='flex:'+t+';--c:'+c;a.textContent=fa(+t);a.title=s.dataset.n;tb.appendChild(a);
var l=document.createElement('a');l.className='chip';l.href='#'+s.id;l.style.cssText='--c:'+c;var ci=document.createElement('i'),cb=document.createElement('b');cb.textContent=fa(+t);l.appendChild(ci);l.appendChild(document.createTextNode(s.dataset.n));l.appendChild(cb);lg.appendChild(l);s._l=[a,l];
s.querySelector('.done').onclick=function(){var ok=s.classList.toggle('ok');this.textContent=ok?'✓ مرور شد (برای برگرداندن بزن)':'✓ این بخش را مرور کردم';s._l.forEach(function(x){x.classList.toggle('ok',ok)});
document.getElementById('cnt').textContent=fa(document.querySelectorAll('.sec.ok').length)+' از '+fa(S.length)};
});
document.getElementById('cnt').textContent=fa(0)+' از '+fa(S.length);
var pb=document.getElementById('pb');
addEventListener('scroll',function(){var h=document.documentElement;pb.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
})();
</script>
</body>
</html>
