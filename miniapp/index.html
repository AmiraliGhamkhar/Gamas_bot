<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03181F" />
    <meta name="color-scheme" content="dark" />
    <title>گاماس</title>
    <!--
      The Telegram WebApp SDK. `telegram.org` is unreachable on some networks
      (notably Iranian ISPs), so a failed load falls back to a self-hosted copy
      served next to the SPA at /app/telegram-web-app.js (see DEPLOY_MINIAPP.md).
      Both loads are parser-blocking, so window.Telegram always exists before
      the deferred app module runs.
    -->
    <script
      src="https://telegram.org/js/telegram-web-app.js"
      onerror="document.write('<script src=&quot;/app/telegram-web-app.js&quot; onerror=&quot;window.__tgSdkMissing=true&quot;><\/script>')"
    ></script>
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
