name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install development tools
        run: python -m pip install "ruff>=0.6" "pytest>=8" "mypy>=1.11"
      - name: Dependency consistency
        run: |
          python -m pip check
          python -m scripts.sync_requirements --check
      - name: Lint
        run: ruff check .
      - name: Type check (incremental gate)
        run: python -m mypy
      - name: Byte-compile every module
        run: python -m compileall -q gamas_bot scripts tests passenger_wsgi.py
      - name: Migration integrity (fresh v3 database)
        run: |
          python - <<'PY'
          import asyncio
          import tempfile
          from pathlib import Path

          from gamas_bot.db import Database, MIGRATIONS_DIR

          async def main() -> None:
              with tempfile.TemporaryDirectory() as tmp:
                  db = Database(Path(tmp) / "ci.sqlite3")
                  try:
                      await db.connect()
                      rows = await db.db.execute_fetchall(
                          "SELECT name FROM schema_migrations ORDER BY name"
                      )
                      applied = [row["name"] for row in rows]
                      expected = sorted(path.name for path in MIGRATIONS_DIR.glob("*.sql"))
                      assert expected, "no v3 migrations were found"
                      assert applied == expected, f"applied {applied}, expected {expected}"

                      rows = await db.db.execute_fetchall(
                          "SELECT COUNT(*) AS count FROM sqlite_master "
                          "WHERE type = 'table' AND name NOT LIKE 'sqlite_%' "
                          "AND name != 'schema_migrations'"
                      )
                      table_count = int(rows[0]["count"])
                      assert table_count == 8, f"expected 8 application tables, found {table_count}"
                      print(f"applied {len(applied)} migration(s); verified {table_count} application tables")
                  finally:
                      await db.close()

          asyncio.run(main())
          PY
      - name: Run offline regression tests with pytest
        run: python -m pytest -q
      - name: Run the same suite through unittest (deployment-compatible runner)
        run: python -m unittest discover -s tests -q
      - name: Media worker dependency smoke test
        run: python -m gamas_bot.media_worker check
      - name: Dependency security audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip-audit -r requirements.txt
