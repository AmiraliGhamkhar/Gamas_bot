name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest
      - name: Check dependency consistency and critical Python errors
        run: |
          python -m pip check
          ruff check gamas_bot scripts tests passenger_wsgi.py --select E9,F
      - name: Byte-compile every module
        run: python -m compileall -q gamas_bot scripts tests passenger_wsgi.py
      - name: Run offline regression tests
        run: python -m pytest -q
      - name: Run the same suite through unittest (CI entry point used by deployments)
        run: python -m unittest discover -s tests -v
